<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>注册</title>
    <link rel="stylesheet" href="app.css">
</head>
<body class="auth-page">
<main class="auth-card">
<h2>创建账号</h2>
<p class="subtext">加入房产评价社区，分享真实居住体验</p>
<form action="/user/register" method="post">
    <label for="username">用户名</label><input id="username" type="text" name="username" placeholder="请输入用户名" required>
    <label for="password">密码</label><input id="password" type="password" name="password" placeholder="请输入密码" required>
    <label for="email">邮箱</label><input id="email" type="email" name="email" placeholder="请输入邮箱" required>
    <input type="submit" value="注册">
</form>
<p class="auth-links">已有账号？<a href="login.html">去登录</a><a class="browse-link" href="posts.html">先随便看看</a></p>
</main>
</body>
</html>
