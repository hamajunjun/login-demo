<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>帖子管理</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h2 {
            margin-bottom: 10px;
        }
        .nav {
            margin: 15px 0;
        }
        .nav a, .nav button {
            margin-right: 10px;
        }
        .post-item {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .post-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 8px;
        }
        .post-content {
            color: #333;
            margin-bottom: 8px;
        }
        .post-meta {
            color: #666;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .post-actions button {
            margin-right: 5px;
            cursor: pointer;
        }
        .pagination {
            margin-top: 15px;
        }
        .pagination button {
            margin-right: 5px;
            padding: 5px 10px;
            cursor: pointer;
        }
        #tip {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<h2>帖子管理（管理员）</h2>

<div class="nav">
    <button onclick="logout()">退出登录</button>
    <a href="posts.html">帖子广场</a>
    <a href="post.html">去发帖</a>
    <a href="community.html">添加小区</a>
    <a href="my-posts.html">我的帖子</a>
    <a href="profile.html">个人中心</a>
    <a href="admin-users.html">用户管理</a>
</div>

<p id="tip"></p>

<div id="postList">
    <!-- 帖子数据会填充到这里 -->
</div>

<div class="pagination" id="pagination" style="display: none;">
    <button onclick="loadPosts(1)">首页</button>
    <button onclick="loadPosts(currentPage - 1)">上一页</button>
    <span id="pageInfoText"></span>
    <button onclick="loadPosts(currentPage + 1)">下一页</button>
    <button onclick="loadPosts(totalPages)">末页</button>
</div>

<script>
    const token = localStorage.getItem('token');
    let currentPage = 1;
    let totalPages = 1;

    // 页面加载时检查登录状态
    if (!token) {
        document.getElementById('tip').innerText = '未登录，请先登录';
        setTimeout(() => {
            window.location.href = 'login.html';
        }, 1500);
    } else {
        checkAdmin();
    }

    // 从 token 中解析角色，判断是否是管理员
    function checkAdmin() {
        const role = getRoleFromToken(token);
        if (role !== 'ADMIN') {
            document.getElementById('tip').innerText = '权限不足，仅管理员可访问';
            setTimeout(() => {
                window.location.href = 'post.html';
            }, 1500);
            return;
        }
        loadPosts(1);
    }

    // 解析 JWT token 中的 payload，取出 role
    function getRoleFromToken(token) {
        try {
            const payload = token.split('.')[1];
            const decoded = atob(payload.replace(/-/g, '+').replace(/_/g, '/'));
            const json = JSON.parse(decoded);
            return json.role;
        } catch (e) {
            return null;
        }
    }

    // 加载帖子列表（分页）
    function loadPosts(pageNum) {
        if (pageNum < 1) pageNum = 1;
        currentPage = pageNum;

        fetch('/admin/post/list?pageNum=' + pageNum + '&pageSize=10', {
            method: 'GET',
            headers: {
                'Authorization': token
            }
        })
            .then(response => handleResponse(response))
            .then(data => {
                if (data.code !== 200) {
                    document.getElementById('tip').innerText = '查询失败：' + data.msg;
                    return;
                }

                const pageInfo = data.data;
                totalPages = pageInfo.pages || 1;
                renderPosts(pageInfo.list);
                document.getElementById('pagination').style.display = 'block';
                document.getElementById('pageInfoText').innerText =
                    ' 第 ' + pageInfo.pageNum + ' / ' + totalPages + ' 页，共 ' + pageInfo.total + ' 条 ';
            })
            .catch(error => {
                document.getElementById('tip').innerText = '请求失败：' + error;
            });
    }

    // 渲染帖子列表
    function renderPosts(list) {
        const container = document.getElementById('postList');
        container.innerHTML = '';

        if (!list || list.length === 0) {
            container.innerHTML = '<p>暂无帖子</p>';
            return;
        }

        for (let i = 0; i < list.length; i++) {
            const post = list[i];
            const div = document.createElement('div');
            div.className = 'post-item';
            div.innerHTML =
                '<div class="post-title">ID:' + post.id + ' - <a href="post-detail.html?id=' + post.id + '">' + post.title + '</a></div>' +
                '<div class="post-content">' + post.content + '</div>' +
                '<div class="post-meta">' +
                '作者：' + (post.username || '') +
                ' | 小区ID：' + (post.communityId || '') +
                ' | 评分：' + (post.rating || 0) +
                ' | 发布时间：' + (post.createTime || '') +
                '</div>' +
                '<div class="post-actions">' +
                '<button onclick="deletePost(' + post.id + ')">删除帖子</button>' +
                '</div>';
            container.appendChild(div);
        }
    }

    // 删除帖子
    function deletePost(id) {
        if (!confirm('确定要删除 ID 为 ' + id + ' 的帖子吗？')) {
            return;
        }

        fetch('/admin/post/delete?id=' + id, {
            method: 'POST',
            headers: {
                'Authorization': token
            }
        })
            .then(response => handleResponse(response))
            .then(data => {
                if (data.code === 200) {
                    alert('删除成功');
                    loadPosts(currentPage);
                } else {
                    alert('删除失败：' + data.msg);
                }
            })
            .catch(error => {
                alert('请求失败：' + error);
            });
    }

    // 统一处理响应：如果状态码不是 200，抛出错误信息
    function handleResponse(response) {
        if (!response.ok) {
            return response.text().then(text => {
                throw new Error(text || '请求失败，状态码：' + response.status);
            });
        }
        return response.json();
    }

    // 退出登录
    function logout() {
        localStorage.removeItem('token');
        alert('已退出登录');
        window.location.href = 'login.html';
    }
</script>
</body>
</html>
