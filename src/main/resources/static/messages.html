<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>私信</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .nav {
            margin: 15px 0;
        }
        .nav a, .nav button {
            margin-right: 10px;
        }
        .stat-box {
            margin: 15px 0;
            font-size: 16px;
        }
        .stat-box span {
            margin-right: 20px;
            font-weight: bold;
        }
        .send-box {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            background-color: #fafafa;
        }
        .send-box input, .send-box textarea {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
        }
        .send-box textarea {
            height: 60px;
        }
        .send-box button {
            margin-top: 10px;
            padding: 8px 15px;
            cursor: pointer;
        }
        .tab {
            margin: 15px 0;
        }
        .tab button {
            padding: 8px 15px;
            margin-right: 10px;
            cursor: pointer;
        }
        .tab button.active {
            background-color: #0066cc;
            color: white;
            border: none;
        }
        .message-item {
            border: 1px solid #ccc;
            padding: 12px;
            margin: 8px 0;
            border-radius: 5px;
        }
        .message-item.unread {
            background-color: #fff8e1;
            border-left: 4px solid #ff9800;
        }
        .message-content {
            color: #333;
            margin: 8px 0;
        }
        .message-meta {
            color: #666;
            font-size: 12px;
        }
        .pagination {
            margin-top: 15px;
        }
        .pagination button {
            margin-right: 5px;
            padding: 5px 10px;
            cursor: pointer;
        }
        #tip {
            color: red;
            margin-top: 10px;
        }
        .badge {
            display: inline-block;
            background-color: #ff4444;
            color: white;
            border-radius: 10px;
            padding: 0 6px;
            font-size: 12px;
            margin-left: 4px;
            vertical-align: middle;
        }
        .badge:empty {
            display: none;
        }
    </style>
</head>
<body>
<h2>私信</h2>

<div class="nav">
    <button onclick="logout()">退出登录</button>
    <a href="posts.html">帖子广场</a>
    <a href="post.html">去发帖</a>
    <a href="hot.html">热门帖子</a>
    <a href="my-posts.html">我的帖子</a>
    <a href="communities.html">小区列表</a>
    <a href="my-favorites.html">我的收藏</a>
    <a href="my-follows.html">我的关注</a>
    <a href="profile.html">个人中心</a>
    <a href="notifications.html">消息中心<span id="unreadBadge" class="badge"></span></a>
    <a id="adminLink" href="admin-users.html" style="display:none;">用户管理</a>
    <a id="adminPostsLink" href="admin-posts.html" style="display:none;">帖子管理</a>
</div>

<div class="stat-box">
    <span>未读私信：<span id="unreadCount">0</span></span>
</div>

<div class="send-box">
    <p>发私信：</p>
    <input type="text" id="receiverId" placeholder="收件人 ID">
    <textarea id="messageContent" placeholder="私信内容..."></textarea>
    <br>
    <button onclick="sendMessage()">发送</button>
</div>

<div class="tab">
    <button id="tabInbox" class="active" onclick="switchTab('inbox')">收件箱</button>
    <button id="tabOutbox" onclick="switchTab('outbox')">发件箱</button>
</div>

<p id="tip"></p>

<div id="messageList">
    <!-- 私信数据会填充到这里 -->
</div>

<div class="pagination" id="pagination" style="display: none;">
    <button onclick="loadMessages(1)">首页</button>
    <button onclick="loadMessages(currentPage - 1)">上一页</button>
    <span id="pageInfoText"></span>
    <button onclick="loadMessages(currentPage + 1)">下一页</button>
    <button onclick="loadMessages(totalPages)">末页</button>
</div>

<script>
    const token = localStorage.getItem('token');
    let currentPage = 1;
    let totalPages = 1;
    let currentTab = 'inbox';

    // 从 URL 参数预填收件人（从用户主页「私信他」跳转过来）
    const urlParams = new URLSearchParams(window.location.search);
    const preReceiverId = urlParams.get('receiverId');
    if (preReceiverId) {
        document.getElementById('receiverId').value = preReceiverId;
    }

    if (!token) {
        document.getElementById('tip').innerText = '未登录，请先登录';
        setTimeout(() => {
            window.location.href = 'login.html';
        }, 1500);
    } else {
        showAdminLinks();
        loadUnreadCount();
        loadMessages(1);
    }

    function showAdminLinks() {
        const role = getRoleFromToken(token);
        if (role === 'ADMIN') {
            document.getElementById('adminLink').style.display = 'inline';
            document.getElementById('adminPostsLink').style.display = 'inline';
        }
    }

    function getRoleFromToken(token) {
        if (!token) return null;
        try {
            const payload = token.split('.')[1];
            const decoded = atob(payload.replace(/-/g, '+').replace(/_/g, '/'));
            return JSON.parse(decoded).role;
        } catch (e) {
            return null;
        }
    }

    function loadUnreadCount() {
        if (!token) return;
        fetch('/message/unreadCount', {
            method: 'GET',
            headers: {
                'Authorization': token
            }
        })
            .then(response => handleResponse(response))
            .then(data => {
                if (data.code === 200) {
                    document.getElementById('unreadCount').innerText = data.data || 0;
                }
            })
            .catch(error => {
                console.log('获取未读私信数失败：' + error);
            });
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tabInbox').className = tab === 'inbox' ? 'active' : '';
        document.getElementById('tabOutbox').className = tab === 'outbox' ? 'active' : '';
        loadMessages(1);
    }

    function loadMessages(pageNum) {
        if (pageNum < 1) pageNum = 1;
        currentPage = pageNum;

        const url = currentTab === 'inbox'
            ? '/message/inbox?pageNum=' + pageNum + '&pageSize=10'
            : '/message/outbox?pageNum=' + pageNum + '&pageSize=10';

        fetch(url, {
            method: 'GET',
            headers: {
                'Authorization': token
            }
        })
            .then(response => handleResponse(response))
            .then(data => {
                if (data.code !== 200) {
                    document.getElementById('tip').innerText = '查询失败：' + data.msg;
                    return;
                }

                const pageInfo = data.data;
                totalPages = pageInfo.pages || 1;
                renderMessages(pageInfo.list);
                document.getElementById('pagination').style.display = 'block';
                document.getElementById('pageInfoText').innerText =
                    ' 第 ' + pageInfo.pageNum + ' / ' + totalPages + ' 页，共 ' + pageInfo.total + ' 条 ';
            })
            .catch(error => {
                document.getElementById('tip').innerText = '请求失败：' + error;
            });
    }

    function renderMessages(list) {
        const container = document.getElementById('messageList');
        container.innerHTML = '';

        if (!list || list.length === 0) {
            container.innerHTML = '<p>暂无私信</p>';
            return;
        }

        for (let i = 0; i < list.length; i++) {
            const message = list[i];
            const div = document.createElement('div');
            div.className = 'message-item' + (message.isRead === 0 && currentTab === 'inbox' ? ' unread' : '');

            // 收件箱显示发件人，发件箱显示收件人
            const otherUser = currentTab === 'inbox'
                ? (message.senderUsername || '')
                : (message.receiverUsername || '');

            const readButton = (currentTab === 'inbox' && message.isRead === 0)
                ? '<button onclick="markRead(' + message.id + ')">标记已读</button>'
                : '';

            div.innerHTML =
                '<div class="message-meta">' + (currentTab === 'inbox' ? '来自：' : '发给：') + otherUser +
                ' | ' + (message.createTime || '') + '</div>' +
                '<div class="message-content">' + (message.content || '') + '</div>' +
                '<div>' + readButton + '</div>';

            container.appendChild(div);
        }
    }

    function sendMessage() {
        const receiverId = document.getElementById('receiverId').value.trim();
        const content = document.getElementById('messageContent').value.trim();

        if (!receiverId) {
            alert('请输入收件人 ID');
            return;
        }
        if (!content) {
            alert('私信内容不能为空');
            return;
        }

        fetch('/message/send?receiverId=' + receiverId + '&content=' + encodeURIComponent(content), {
            method: 'POST',
            headers: {
                'Authorization': token
            }
        })
            .then(response => handleResponse(response))
            .then(data => {
                if (data.code === 200) {
                    alert('发送成功');
                    document.getElementById('messageContent').value = '';
                    switchTab('outbox');
                } else {
                    alert('发送失败：' + data.msg);
                }
            })
            .catch(error => {
                alert('请求失败：' + error);
            });
    }

    function markRead(id) {
        fetch('/message/markRead?id=' + id, {
            method: 'POST',
            headers: {
                'Authorization': token
            }
        })
            .then(response => handleResponse(response))
            .then(data => {
                if (data.code === 200) {
                    loadMessages(currentPage);
                    loadUnreadCount();
                } else {
                    alert('标记失败：' + data.msg);
                }
            })
            .catch(error => {
                alert('请求失败：' + error);
            });
    }

    function handleResponse(response) {
        if (!response.ok) {
            return response.text().then(text => {
                throw new Error(text || '请求失败，状态码：' + response.status);
            });
        }
        return response.json();
    }

    function logout() {
        localStorage.removeItem('token');
        alert('已退出登录');
        window.location.href = 'login.html';
    }
</script>
</body>
</html>
