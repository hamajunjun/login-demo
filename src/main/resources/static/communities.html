<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>小区列表</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .nav {
            margin: 15px 0;
        }
        .nav a, .nav button {
            margin-right: 10px;
        }
        .community-item {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .community-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 8px;
        }
        .community-name a {
            color: #333;
            text-decoration: none;
        }
        .community-name a:hover {
            color: #0066cc;
            text-decoration: underline;
        }
        .community-meta {
            color: #666;
            font-size: 12px;
        }
        .pagination {
            margin-top: 15px;
        }
        .pagination button {
            margin-right: 5px;
            padding: 5px 10px;
            cursor: pointer;
        }
        #tip {
            color: red;
            margin-top: 10px;
        }
        .badge {
            display: inline-block;
            background-color: #ff4444;
            color: white;
            border-radius: 10px;
            padding: 0 6px;
            font-size: 12px;
            margin-left: 4px;
            vertical-align: middle;
        }
        .badge:empty {
            display: none;
        }
    </style>
</head>
<body>
<h2>小区列表</h2>

<div class="nav">
    <button onclick="logout()">退出登录</button>
    <a href="posts.html">帖子广场</a>
    <a href="post.html">去发帖</a>
    <a href="hot.html">热门帖子</a>
    <a href="my-posts.html">我的帖子</a>
    <a href="my-favorites.html">我的收藏</a>
    <a href="my-follows.html">我的关注</a>
    <a href="community.html">添加小区</a>
    <a href="profile.html">个人中心</a>
    <a href="notifications.html">消息中心<span id="unreadBadge" class="badge"></span></a>
    <a id="adminLink" href="admin-users.html" style="display:none;">用户管理</a>
    <a id="adminPostsLink" href="admin-posts.html" style="display:none;">帖子管理</a>
</div>

<p id="tip"></p>

<div id="communityList">
    <!-- 小区数据会填充到这里 -->
</div>

<div class="pagination" id="pagination" style="display: none;">
    <button onclick="loadCommunities(1)">首页</button>
    <button onclick="loadCommunities(currentPage - 1)">上一页</button>
    <span id="pageInfoText"></span>
    <button onclick="loadCommunities(currentPage + 1)">下一页</button>
    <button onclick="loadCommunities(totalPages)">末页</button>
</div>

<script>
    const token = localStorage.getItem('token');
    let currentPage = 1;
    let totalPages = 1;

    showAdminLinks();
    loadUnreadCount();
    loadCommunities(1);

    function showAdminLinks() {
        const role = getRoleFromToken(token);
        if (role === 'ADMIN') {
            document.getElementById('adminLink').style.display = 'inline';
            document.getElementById('adminPostsLink').style.display = 'inline';
        }
    }

    function getRoleFromToken(token) {
        if (!token) return null;
        try {
            const payload = token.split('.')[1];
            const decoded = atob(payload.replace(/-/g, '+').replace(/_/g, '/'));
            return JSON.parse(decoded).role;
        } catch (e) {
            return null;
        }
    }

    function loadUnreadCount() {
        if (!token) return;
        fetch('/notification/unreadCount', {
            method: 'GET',
            headers: {
                'Authorization': token
            }
        })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200 && data.data > 0) {
                    document.getElementById('unreadBadge').innerText = data.data;
                }
            })
            .catch(error => {
                console.log('获取未读消息数失败：' + error);
            });
    }

    function loadCommunities(pageNum) {
        if (pageNum < 1) pageNum = 1;
        currentPage = pageNum;

        fetch('/community/list?pageNum=' + pageNum + '&pageSize=10')
            .then(response => handleResponse(response))
            .then(data => {
                if (data.code !== 200) {
                    document.getElementById('tip').innerText = '查询失败：' + data.msg;
                    return;
                }

                const pageInfo = data.data;
                totalPages = pageInfo.pages || 1;
                renderCommunities(pageInfo.list);
                document.getElementById('pagination').style.display = 'block';
                document.getElementById('pageInfoText').innerText =
                    ' 第 ' + pageInfo.pageNum + ' / ' + totalPages + ' 页，共 ' + pageInfo.total + ' 条 ';
            })
            .catch(error => {
                document.getElementById('tip').innerText = '请求失败：' + error;
            });
    }

    function renderCommunities(list) {
        const container = document.getElementById('communityList');
        container.innerHTML = '';

        if (!list || list.length === 0) {
            container.innerHTML = '<p>暂无小区</p>';
            return;
        }

        for (let i = 0; i < list.length; i++) {
            const c = list[i];
            const div = document.createElement('div');
            div.className = 'community-item';
            div.innerHTML =
                '<div class="community-name"><a href="community-posts.html?id=' + c.id + '&name=' + encodeURIComponent(c.name || '') + '">' + (c.name || '未命名小区') + '</a></div>' +
                '<div class="community-meta">' +
                '城市：' + (c.city || '') +
                ' | 区域：' + (c.district || '') +
                ' | 地址：' + (c.address || '') +
                ' | 价格：' + (c.price || '') +
                '</div>';
            container.appendChild(div);
        }
    }

    function handleResponse(response) {
        if (!response.ok) {
            return response.text().then(text => {
                throw new Error(text || '请求失败，状态码：' + response.status);
            });
        }
        return response.json();
    }

    function logout() {
        localStorage.removeItem('token');
        alert('已退出登录');
        window.location.href = 'login.html';
    }
</script>
</body>
</html>
