<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>我的帖子</title>
    <style>
        .post-item {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .post-title {
            font-weight: bold;
            font-size: 16px;
        }
        .post-meta {
            color: #666;
            font-size: 12px;
            margin-top: 5px;
        }
        .post-actions {
            margin-top: 8px;
        }
        .post-actions button {
            margin-right: 8px;
            cursor: pointer;
        }
        #editForm {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            display: none;
            background-color: #fafafa;
        }
        #editForm input, #editForm textarea {
            padding: 5px;
            margin-right: 10px;
            width: 300px;
        }
        #editForm textarea {
            height: 80px;
        }
        .badge {
            display: inline-block;
            background-color: #ff4444;
            color: white;
            border-radius: 10px;
            padding: 0 6px;
            font-size: 12px;
            margin-left: 4px;
            vertical-align: middle;
        }
        .badge:empty {
            display: none;
        }
    </style>
</head>
<body>
<h2>我的帖子</h2>

<p>
    <button onclick="logout()">退出登录</button>
    <button onclick="deleteMyAccount()">注销账号</button>
    <a href="posts.html">帖子广场</a>
    <a href="hot.html">热门榜单</a>
    <a href="post.html">去发帖</a>
    <a href="hot.html">热门帖子</a>
    <a href="communities.html">小区列表</a>
    <a href="my-favorites.html">我的收藏</a>
    <a href="my-follows.html">我的关注</a>
    <a href="community.html">添加小区</a>
    <a href="profile.html">个人中心</a>
    <a href="notifications.html">消息中心<span id="unreadBadge" class="badge"></span></a>
    <a id="adminLink" href="admin-users.html" style="display:none;">用户管理</a>
    <a id="adminPostsLink" href="admin-posts.html" style="display:none;">帖子管理</a>
</p>

<p id="tip"></p>

<div id="editForm" style="display:none;">
    <h3>编辑帖子</h3>
    <p>标题：<input type="text" id="editTitle"></p>
    <p>内容：<textarea id="editContent"></textarea></p>
    <p>
        <input type="hidden" id="editId">
        <button onclick="submitEdit()">保存</button>
        <button onclick="cancelEdit()">取消</button>
    </p>
</div>

<div id="postList"></div>

<script>
    // 页面加载时自动查询
    const token = localStorage.getItem('token');

    if (!token) {
        document.getElementById('tip').innerText = '未登录，请先登录';
    } else {
        loadMyPosts();
    }

    showAdminLink();
    loadUnreadCount();

    function showAdminLink() {
        const role = getRoleFromToken(token);
        if (role === 'ADMIN') {
            document.getElementById('adminLink').style.display = 'inline';
            document.getElementById('adminPostsLink').style.display = 'inline';
        }
    }

    // 加载未读消息数，显示在消息中心入口上
    function loadUnreadCount() {
        if (!token) return;
        fetch('/notification/unreadCount', {
            method: 'GET',
            headers: {
                'Authorization': token
            }
        })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200 && data.data > 0) {
                    document.getElementById('unreadBadge').innerText = data.data;
                }
            })
            .catch(error => {
                console.log('获取未读消息数失败：' + error);
            });
    }

    function getRoleFromToken(token) {
        if (!token) return null;
        try {
            const payload = token.split('.')[1];
            const decoded = atob(payload.replace(/-/g, '+').replace(/_/g, '/'));
            return JSON.parse(decoded).role;
        } catch (e) {
            return null;
        }
    }

    function loadMyPosts() {
        fetch('/post/myList?pageNum=1&pageSize=10', {
            method: 'GET',
            headers: {
                'Authorization': token
            }
        })
            .then(response => handleResponse(response))
            .then(data => {
                if (data.code !== 200) {
                    document.getElementById('tip').innerText = '查询失败：' + data.msg;
                    return;
                }

                const pageInfo = data.data;
                const list = pageInfo.list;

                if (list.length === 0) {
                    document.getElementById('tip').innerText = '你还没有发过帖子';
                    document.getElementById('postList').innerHTML = '';
                    return;
                }

                document.getElementById('tip').innerText = '共 ' + pageInfo.total + ' 条帖子';

                const container = document.getElementById('postList');
                container.innerHTML = '';
                for (let i = 0; i < list.length; i++) {
                    container.appendChild(createPostElement(list[i]));
                }
            })
            .catch(error => {
                document.getElementById('tip').innerText = '请求失败：' + error;
            });
    }

    function createPostElement(post) {
        const div = document.createElement('div');
        div.className = 'post-item';

        const titleDiv = document.createElement('div');
        titleDiv.className = 'post-title';
        const titleLink = document.createElement('a');
        titleLink.href = 'post-detail.html?id=' + post.id;
        titleLink.innerText = post.title || '';
        titleDiv.appendChild(titleLink);

        const contentDiv = document.createElement('div');
        contentDiv.innerText = post.content || '';

        const metaDiv = document.createElement('div');
        metaDiv.className = 'post-meta';
        metaDiv.innerText = '评分：' + (post.rating || 0) + ' 分 | 点赞：' + (post.likeCount || 0) + ' | 发布时间：' + (post.createTime || '');

        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'post-actions';

        const editBtn = document.createElement('button');
        editBtn.innerText = '编辑';
        editBtn.onclick = function () {
            document.getElementById('editId').value = post.id;
            document.getElementById('editTitle').value = post.title || '';
            document.getElementById('editContent').value = post.content || '';
            document.getElementById('editForm').style.display = 'block';
            window.scrollTo(0, 0);
        };

        const deleteBtn = document.createElement('button');
        deleteBtn.innerText = '删除';
        deleteBtn.onclick = function () {
            deletePost(post.id);
        };

        actionsDiv.appendChild(editBtn);
        actionsDiv.appendChild(deleteBtn);

        div.appendChild(titleDiv);
        div.appendChild(contentDiv);
        div.appendChild(metaDiv);
        div.appendChild(actionsDiv);

        return div;
    }

    function cancelEdit() {
        document.getElementById('editForm').style.display = 'none';
        document.getElementById('editId').value = '';
        document.getElementById('editTitle').value = '';
        document.getElementById('editContent').value = '';
    }

    function submitEdit() {
        const id = document.getElementById('editId').value;
        const title = document.getElementById('editTitle').value.trim();
        const content = document.getElementById('editContent').value.trim();

        if (!title) {
            alert('标题不能为空');
            return;
        }
        if (!content) {
            alert('内容不能为空');
            return;
        }

        fetch('/post/update', {
            method: 'POST',
            headers: {
                'Authorization': token,
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: new URLSearchParams({
                id: id,
                title: title,
                content: content
            })
        })
            .then(response => handleResponse(response))
            .then(data => {
                if (data.code === 200) {
                    alert('修改成功');
                    cancelEdit();
                    loadMyPosts();
                } else {
                    alert('修改失败：' + data.msg);
                }
            })
            .catch(error => {
                alert('请求失败：' + error);
            });
    }

    function deletePost(id) {
        if (!confirm('确定要删除这条帖子吗？')) {
            return;
        }

        fetch('/post/delete?id=' + id, {
            method: 'POST',
            headers: {
                'Authorization': token
            }
        })
            .then(response => handleResponse(response))
            .then(data => {
                if (data.code === 200) {
                    alert('删除成功');
                    loadMyPosts();
                } else {
                    alert('删除失败：' + data.msg);
                }
            })
            .catch(error => {
                alert('请求失败：' + error);
            });
    }

    function handleResponse(response) {
        if (!response.ok) {
            return response.text().then(text => {
                throw new Error(text || '请求失败，状态码：' + response.status);
            });
        }
        return response.json();
    }

    function logout() {
        localStorage.removeItem('token');
        alert('已退出登录');
        window.location.href = 'login.html';
    }

    function deleteMyAccount() {
        // 先弹窗确认，防止误操作
        if (!confirm('确定要注销账号吗？此操作不可恢复！')) {
            return;
        }

        fetch('/user/deleteMyAccount', {
            method: 'POST',
            headers: {
                'Authorization': token
            }
        })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    // 删除成功后，清除本地 token 并跳回登录页
                    localStorage.removeItem('token');
                    alert('账号已注销');
                    window.location.href = 'login.html';
                } else {
                    alert('注销失败：' + data.msg);
                }
            })
            .catch(error => {
                alert('请求失败：' + error);
            });
    }
</script>
</body>
</html>
