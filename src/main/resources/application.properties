server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/login_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.logindemo.entity

# Redis config
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0

# JWT config
jwt.secret=your-secret-key

# SpringDoc / Knife4j config
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

#Swagger/Knife4j
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

#bloom
bloom.filter.username.expected-insertions=1000000
bloom.filter.username.false-probability=0.01

#bloom
bloom.filter.post.expected-insertions=10000000
bloom.filter.post.false-probability=0.01




